workflows:
  centro-multimedia-ios:
    name: Centro Multimedia → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic        # la misma integración que usa AVO Performance

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.avoperformance.centromultimedia
      vars:
        BUNDLE_ID: com.avoperformance.centromultimedia
      xcode: latest

    scripts:
      - name: Generar el proyecto de Xcode
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          # Número de compilación automático para TestFlight
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate

      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles

      - name: Compilar IPA firmada
        script: |
          xcode-project build-ipa \
            --project CentroMultimedia.xcodeproj \
            --scheme CentroMultimedia

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

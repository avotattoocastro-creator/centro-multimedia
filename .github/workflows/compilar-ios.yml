name: Compilar app iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild \
            -project CentroMultimedia.xcodeproj \
            -scheme CentroMultimedia \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/CentroMultimedia.app

      - name: Mostrar errores (si los hay)
        if: failure()
        run: grep -n "error:" build.log | head -50 || true

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CentroMultimedia.app Payload/
          zip -qry CentroMultimedia-sin-firmar.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: CentroMultimedia-ipa
          path: CentroMultimedia-sin-firmar.ipa
          retention-days: 30

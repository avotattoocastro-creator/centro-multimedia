name: Subir a TestFlight

# Mismo sistema que la app iPad de AVO (repo apk_android_avo): archivo sin firmar + firma en la nube de Apple al exportar.
# Secretos del repositorio (Settings › Secrets and variables › Actions), los mismos que en apk_android_avo:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8 (texto del .p8) o ASC_KEY_P8_BASE64
on:
  workflow_dispatch:

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Comprobar secretos
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || { [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_BASE64" ]; } || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Faltan secretos. Copia en este repositorio los mismos de apk_android_avo: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID y ASC_KEY_P8."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Xcode 26, proyecto y clave API
        run: |
          # App Store Connect solo acepta compilaciones hechas con el SDK de iOS 26 (Xcode 26) o posterior
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen >/dev/null
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
          mkdir -p ~/private_keys
          if [ -n "$ASC_KEY_P8" ]; then printf '%s' "$ASC_KEY_P8" > /tmp/key_raw.txt
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > /tmp/key_raw.txt; fi
          # el texto pegado desde un iPad puede perder los saltos de línea: se reconstruye un PEM limpio
          python3 - "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import re, sys, base64
          raw = open('/tmp/key_raw.txt', encoding='utf-8', errors='ignore').read()
          body = re.sub(r'-----(BEGIN|END) PRIVATE KEY-----', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          der = base64.b64decode(body)
          b64 = base64.b64encode(der).decode()
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(b64[i:i+64] for i in range(0, len(b64), 64)) + '\n-----END PRIVATE KEY-----\n'
          open(sys.argv[1], 'w').write(pem)
          print('Clave .p8 lista:', len(der), 'bytes')
          PY
          rm -f /tmp/key_raw.txt

      - name: Archivar (sin firmar; se firma al exportar)
        run: |
          set -o pipefail
          xcodebuild archive -project CentroMultimedia.xcodeproj -scheme CentroMultimedia -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/CentroMultimedia.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee archive.log | tail -30
          test -d build/CentroMultimedia.xcarchive || { grep -n "error:" archive.log | head -40; exit 1; }

      - name: Subir a TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/CentroMultimedia.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -40
          echo "::notice::Compilación $BUILD_NUMBER enviada a TestFlight (org.avoperformance.centromultimedia)."

      - name: Borrar la clave
        if: always()
        run: rm -rf ~/private_keys
